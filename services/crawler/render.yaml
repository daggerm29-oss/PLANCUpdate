services:
  - type: web
    name: corporate-intel-bridge
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 120 --worker-tmp-dir /dev/shm app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SERPER_API_KEY
        sync: false
